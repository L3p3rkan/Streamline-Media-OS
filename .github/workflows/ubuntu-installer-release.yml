name: Build Ubuntu installer

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dashboard build dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Ubuntu installer
        run: ./streamline-os/build-ubuntu-package.sh "${GITHUB_REF_NAME#v}"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          package="streamline-os/packages/streamline-kiosk_${GITHUB_REF_NAME#v}_amd64.deb"
          checksum="$package.sha256"
          for attempt in 1 2 3; do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              if gh release upload "$GITHUB_REF_NAME" "$package" "$checksum" --clobber; then
                exit 0
              fi
            elif gh release create "$GITHUB_REF_NAME" "$package" "$checksum" \
              --target "$GITHUB_SHA" \
              --title "Streamline ${GITHUB_REF_NAME}" \
              --generate-notes; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Release creation or upload failed (attempt $attempt/3), retrying in 10s..." >&2
              sleep 10
            fi
          done

          echo "Failed to create the release or upload installer files after 3 attempts." >&2
          exit 1
