name: Build Ubuntu installer

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dashboard build dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Ubuntu installer
        run: ./streamline-os/build-ubuntu-package.sh "${GITHUB_REF_NAME#v}"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          package="streamline-os/packages/streamline-kiosk_${GITHUB_REF_NAME#v}_amd64.deb"
          checksum="$package.sha256"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$package" "$checksum" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$package" "$checksum" \
              --title "Streamline ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
